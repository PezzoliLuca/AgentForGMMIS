[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gmmis"
version = "0.1.0"
description = "Multi-Agent AI System for Generalist vs Specialist Medical Image Segmentation Benchmarking"
authors = [
    { name = "Luca Pezzoli", email = "luca2.pezzoli@mail.polimi.it" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
